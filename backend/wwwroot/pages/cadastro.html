<!DOCTYPE html>
<!-- CADASTRO: formulário de criação de conta do protótipo. -->

<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta | MartVerdi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Poppins,sans-serif}body{min-height:100vh;background:#F8FAF9;color:#1B2A23;display:flex;align-items:center;justify-content:center;padding:24px}.cadastro-page{width:min(960px,100%);display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 18px 50px rgba(27,42,35,.12)}.cadastro-brand{background:#2D6A4F;color:#fff;padding:55px 45px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.cadastro-brand img{width:150px;height:150px;object-fit:contain;background:#fff;border-radius:50%;padding:15px;margin-bottom:25px}.cadastro-brand h1{font-size:28px;margin-bottom:10px}.cadastro-brand p{opacity:.9;line-height:1.6}.cadastro-form{padding:55px 45px}.kicker{font-size:12px;color:#2D6A4F;font-weight:700;letter-spacing:1px}.cadastro-form h2{font-size:30px;margin:7px 0 10px}.intro{color:#68756E;font-size:14px;margin-bottom:20px}label{display:block;font-size:13px;font-weight:600;margin:13px 0 7px}.field{width:100%;height:46px;border:1px solid #D4DED8;border-radius:9px;padding:0 14px;outline:none}.field:focus{border-color:#2D6A4F;box-shadow:0 0 0 3px rgba(45,106,79,.1)}.btn{width:100%;height:48px;border:0;border-radius:9px;background:#E76F51;color:#fff;font-weight:700;margin-top:20px;cursor:pointer}.btn:hover{background:#D85B3B}.links{margin-top:18px;text-align:center;font-size:13px}.links a{color:#2D6A4F;font-weight:700;text-decoration:none}.mensagem{margin-top:14px;min-height:20px;font-size:13px;font-weight:600}@media(max-width:700px){.cadastro-page{grid-template-columns:1fr}.cadastro-brand{padding:35px}.cadastro-brand img{width:100px;height:100px}.cadastro-form{padding:35px 25px}}
  </style>
  <link rel="icon" type="image/png" href="../favicon.png">
</head>
<body>
  <main class="cadastro-page">
    <section class="cadastro-brand"><img src="../assets/img/martverdi-icon.png" alt="Logo MartVerdi"><h1>Crie sua conta</h1><p>Cadastre-se no MartVerdi para ter uma experiência mais completa nas suas compras.</p></section>
    <section class="cadastro-form">
      <span class="kicker">NOVO CLIENTE</span><h2>Cadastre-se</h2><p class="intro">Preencha seus dados para criar sua conta.</p>
      <form id="cadastroForm">
        <label for="nome">Nome</label><input class="field" id="nome" required placeholder="Seu nome">
        <label for="usuario">Usuário</label><input class="field" id="usuario" required placeholder="Escolha um usuário">
        <label for="email">E-mail</label><input class="field" id="email" type="email" required placeholder="seuemail@email.com">
        <label for="dataNascimento">Data de nascimento</label><input class="field" id="dataNascimento" type="date" required>
        <label for="cep">CEP</label><input class="field" id="cep" inputmode="numeric" maxlength="9" required placeholder="00000-000">
        <label for="senha">Senha</label><input class="field" id="senha" type="password" required placeholder="Crie uma senha">
        <label for="confirmar">Confirmar senha</label><input class="field" id="confirmar" type="password" required placeholder="Repita a senha">
        <button class="btn" type="submit">Criar conta</button>
      </form>
      <p id="mensagem" class="mensagem"></p>
      <div class="links"><a href="./login.html">Já tenho uma conta → Entrar</a><br><a href="../index.html">← Voltar ao mercado</a></div>
    </section>
  </main>
  <script>
    document.getElementById('cadastroForm').addEventListener('submit',function(e){
      e.preventDefault();
      const nome=document.getElementById('nome').value.trim(),usuario=document.getElementById('usuario').value.trim(),email=document.getElementById('email').value.trim(),dataNascimento=document.getElementById('dataNascimento').value,cep=document.getElementById('cep').value.trim(),senha=document.getElementById('senha').value,confirmar=document.getElementById('confirmar').value,m=document.getElementById('mensagem');
      let usuarios=JSON.parse(localStorage.getItem('martverdiUsuarios')||'[]');
      if(cep.replace(/\D/g,'').length!==8){m.textContent='Digite um CEP válido.';m.style.color='#D85B3B';return;}if(senha!==confirmar){m.textContent='As senhas não coincidem.';m.style.color='#D85B3B';return;}
      if(usuario.toLowerCase()==='admin'||usuarios.some(u=>u.usuario.toLowerCase()===usuario.toLowerCase())){m.textContent='Esse usuário já está cadastrado.';m.style.color='#D85B3B';return;}
      usuarios.push({nome,usuario,email,dataNascimento,cep,senha});localStorage.setItem('martverdiUsuarios',JSON.stringify(usuarios));localStorage.setItem('usuarioLogado',usuario);localStorage.setItem('martverdiCep',cep);m.textContent='Conta criada com sucesso!';m.style.color='#2D6A4F';setTimeout(()=>window.location.href='../index.html',700);
    });
    const cepCadastro=document.getElementById('cep');
    cepCadastro.addEventListener('input',function(){const n=this.value.replace(/\D/g,'').slice(0,8);this.value=n.length>5?n.slice(0,5)+'-'+n.slice(5):n;});
  </script>
</body>
</html>
